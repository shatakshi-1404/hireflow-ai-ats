services:
  - type: web
    name: hireflow-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_REGION
        value: auto
      - key: ENABLE_DOCS
        value: "true"
      - key: TRUSTED_PROXY_COUNT
        value: "0"
      - key: PROTECTED_ACCOUNT_EMAILS
        value: '["demo-admin@example.com","demo-recruiter@example.com","demo-viewer@example.com"]'
      - key: AI_PROVIDER
        value: none
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
